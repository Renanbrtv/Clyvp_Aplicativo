# ==========================================================
# Clyvo - exemplo de configuracao do nginx
#
# O nginx fica na frente da API: recebe o HTTPS na porta 443 e
# repassa para o Node na porta 3333, que nunca e exposto.
#
# Onde colocar (Ubuntu/Debian):
#   sudo cp nginx-clyvo.conf /etc/nginx/sites-available/clyvo
#   sudo ln -s /etc/nginx/sites-available/clyvo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# O certificado HTTPS e gratuito e sai com um comando:
#   sudo certbot --nginx -d api.clyvo.com.br -d app.clyvo.com.br
# O certbot edita este arquivo sozinho para adicionar o SSL.
# ==========================================================

# ---------- API ----------
server {
    listen 80;
    server_name api.clyvo.com.br;

    # Tamanho maximo de um envio (o app manda so JSON, 2M sobra).
    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;

        # Sem estes cabecalhos a API acha que todo mundo tem o mesmo IP
        # e o limite de tentativas de login para de funcionar.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ---------- Site / versao web do app ----------
server {
    listen 80;
    server_name app.clyvo.com.br;

    # Pasta gerada por "npm run build:web" dentro de frontend/dist.
    root /var/www/clyvo;
    index index.html;

    # O app e uma pagina so: qualquer endereco cai no index.html e o
    # roteador do app decide o que mostrar. Sem isso, abrir
    # /privacidade direto no navegador daria 404.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ser guardados para sempre.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
